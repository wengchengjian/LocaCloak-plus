<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LocaCloak</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/popup.css">
  <link rel="stylesheet" href="styles/custom-select.css">
  <link rel="stylesheet" href="styles/activation.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="drawer-container">
    <div class="hero-section">
      <div class="icon-brand">
        <img src="icons/icon-48.png" alt="LocaCloak Logo" class="logo">
        <h1 class="brand-text" data-i18n="brand_name">LocaCloak</h1>
      </div>
      
      <label class="master-toggle">
        <input type="checkbox" id="enabled">
        <div class="toggle-track">
          <div class="toggle-thumb"></div>
        </div>
      </label>
    </div>

    <div class="location-card">
      <div class="location-icon-wrapper">
        <svg class="location-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      </div>
      <div class="location-content">
        <div class="location-label" data-i18n="location_title">Location</div>
        <div class="location-coords" id="location-coords">34.0522, -118.2437</div>
        <div class="location-latlng">
          <span class="location-latlng-label" data-i18n="coords_label">Coordinates: </span>
          <span class="location-latlng-val" id="location-latlng">34.0522, -118.2437</span>
        </div>
        <div class="location-meta">
          <span class="location-tz-label" data-i18n="timezone_label">Timezone: </span>
          <span class="location-tz" id="timezone-info">PDT (UTC-7)</span>
          <span class="location-dst" id="dst-info"></span>
        </div>
      </div>
    </div>

    <div class="protection-panel">
      <div class="protection-header">
        <svg class="protection-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="protection-label" data-i18n="protection_title">Protection</span>
      </div>
      <div class="protection-list">
        <div class="protection-item">
          <span class="protection-name" data-i18n="toggle_webrtc">WebRTC Protection</span>
          <label class="switch-sm">
            <input type="checkbox" id="webrtc-protection">
            <span class="slider-sm"></span>
          </label>
        </div>
        <div class="protection-item">
          <span class="protection-name" data-i18n="toggle_iframe_coverage">Deep Iframe</span>
          <label class="switch-sm">
            <input type="checkbox" id="iframe-coverage">
            <span class="slider-sm"></span>
          </label>
        </div>
        <div class="protection-item">
          <div class="protection-name-group">
            <span class="protection-name" data-i18n="toggle_canvas">Canvas Protection</span>
            <span class="badge-exp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
              <span data-i18n="badge_experimental">Experimental</span>
            </span>
          </div>
          <label class="switch-sm">
            <input type="checkbox" id="canvas-protection">
            <span class="slider-sm"></span>
          </label>
        </div>
        <div class="protection-item">
          <div class="protection-name-group">
            <span class="protection-name" data-i18n="toggle_webgl">WebGL Protection</span>
            <span class="badge-exp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
              <span data-i18n="badge_experimental">Experimental</span>
            </span>
          </div>
          <label class="switch-sm">
            <input type="checkbox" id="webgl-protection">
            <span class="slider-sm"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="action-footer">
      <button id="reset-location" class="btn-ghost" data-i18n-title="reset_la">
        <svg fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
        <span data-i18n="reset_la">Reset LA</span>
      </button>

      <select id="ui-lang-switcher" class="lang-switcher custom-select cs-dropup">
        <option value="en">EN</option>
        <option value="zh-CN">简</option>
        <option value="zh-TW">繁</option>
        <option value="ru">RU</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
        <option value="ar">عر</option>
        <option value="fa">فا</option>
        <option value="ko">한</option>
      </select>

      <button id="theme-toggle" class="btn-icon" title="Toggle Theme">
        <svg id="icon-sun" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="display: none;"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 4.22a1 1 0 011.415 0l.708.707a1 1 0 01-1.414 1.414l-.708-.707a1 1 0 010-1.414zM16 10a1 1 0 01-1-1h-1a1 1 0 110-2h1a1 1 0 011 1zm-4.22 4.22a1 1 0 010 1.415l-.707.708a1 1 0 01-1.414-1.414l.707-.708a1 1 0 011.414 0zM10 16a1 1 0 01-1 1v1a1 1 0 112 0v-1a1 1 0 01-1-1zm-4.22-4.22a1 1 0 01-1.415 0l-.708-.707a1 1 0 011.414-1.414l.708.707a1 1 0 010 1.414zM4 10a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zM5.78 5.78a1 1 0 010-1.415l.707-.708a1 1 0 011.414 1.414l-.707.708a1 1 0 01-1.414 0zM10 6a4 4 0 100 8 4 4 0 000-8z" clip-rule="evenodd"></path></svg>
        <svg id="icon-moon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
      </button>

      <a href="options.html" target="_blank" class="btn-icon" title="Preferences">
        <svg fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
      </a>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="shared.js"></script>
  <script src="custom-select.js"></script>
  <script src="activation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
